<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GizemApt – Apartman Yönetim Paneli</title>
  <meta name="description" content="Apartman gelir-gider takibi, aidat yönetimi ve daire bazlı ödeme durumu paneli.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* ── RESET & BASE ─────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0f1a;
      --surface: #111827;
      --surface2: #1a2236;
      --surface3: #1f2c45;
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --accent2: #818cf8;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --purple: #a855f7;
      --cyan: #06b6d4;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      overflow: hidden;
    }

    /* ── HEADER ───────────────────────────────────────────────── */
    header {
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      position: relative;
      z-index: 10;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #a855f7, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .logo span {
      font-weight: 300;
    }

    header .sep {
      flex: 1;
    }

    /* Month selector */
    .month-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 30px;
      padding: 5px 14px;
    }

    .month-nav button {
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      transition: color .2s;
      padding: 2px 4px;
    }

    .month-nav button:hover {
      color: var(--accent2);
    }

    #monthLabel {
      font-weight: 600;
      font-size: 15px;
      min-width: 130px;
      text-align: center;
      color: var(--text);
    }

    /* Year badge */
    .year-badge {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
    }

    /* Top Panel Kasa Badge */
    .header-kasa {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
      margin-left: 20px;
    }

    .header-kasa .lbl {
      color: var(--text3);
      font-weight: 500;
    }

    .header-kasa .amt {
      font-weight: 700;
      transition: color 0.3s ease;
    }

    /* ── LAYOUT ───────────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr 340px;
      gap: 0;
      height: calc(100vh - 64px);
      overflow: hidden;
    }

    /* Panel base */
    .panel {
      height: 100%;
      overflow-y: auto;
      padding: 16px;
      border-right: 1px solid var(--border);
      scrollbar-width: thin;
      scrollbar-color: var(--surface3) transparent;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel::-webkit-scrollbar {
      width: 4px;
    }

    .panel::-webkit-scrollbar-thumb {
      background: var(--surface3);
      border-radius: 4px;
    }

    /* ── CARD ─────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      transition: border-color .2s;
    }

    .card:hover {
      border-color: var(--border2);
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text3);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* ── LEFT PANEL ───────────────────────────────────────────── */
    .budget-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .budget-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .budget-item .label {
      font-size: 11px;
      color: var(--text3);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 6px;
    }

    .budget-item .value {
      font-size: 18px;
      font-weight: 700;
    }

    .budget-item.income .value {
      color: var(--green);
    }

    .budget-item.expense .value {
      color: var(--red);
    }

    .budget-item.net.positive .value {
      color: var(--cyan);
    }

    .budget-item.net.negative .value {
      color: var(--red);
    }

    .budget-item.collected .value {
      color: var(--purple);
    }

    .budget-bar {
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }

    .budget-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--green), var(--cyan));
      transition: width .6s ease;
    }

    /* Filter pills */
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .pill {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text2);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all .2s;
      user-select: none;
    }

    .pill:hover {
      border-color: var(--accent);
      color: var(--accent2);
    }

    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Transaction list */
    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tx-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      transition: all .2s;
      cursor: default;
      animation: fadeIn .3s ease;
    }

    .tx-item:hover {
      border-color: var(--border2);
      transform: translateX(2px);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tx-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .tx-info {
      flex: 1;
      min-width: 0;
    }

    .tx-name {
      font-weight: 500;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-cat {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px;
    }

    .tx-amount {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
    }

    .tx-amount.income {
      color: var(--green);
    }

    .tx-amount.expense {
      color: var(--red);
    }

    .tx-date {
      font-size: 10px;
      color: var(--text3);
      text-align: right;
      min-width: 36px;
    }

    /* ── MIDDLE PANEL ─────────────────────────────────────────── */
    .middle-panel {
      background: var(--bg);
      border-right: 1px solid var(--border);
      height: 100%;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface3) transparent;
    }

    .middle-panel::-webkit-scrollbar {
      width: 4px;
    }

    .middle-panel::-webkit-scrollbar-thumb {
      background: var(--surface3);
      border-radius: 4px;
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      text-align: center;
      transition: all .2s;
      cursor: pointer;
    }

    .stat-card:hover {
      border-color: var(--border2);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .stat-num {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--text3);
      font-weight: 500;
    }

    /* Dues amount badge */
    .dues-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 30px;
      padding: 8px 20px;
      margin-bottom: 16px;
    }

    .dues-badge .lbl {
      font-size: 13px;
      color: var(--text3);
    }

    .dues-badge .amt {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── GRID MATRIX ───────────────────────────────────────── */
    .apt-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 4px 2px;
    }

    .apt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      min-height: 90px;
    }

    .apt-card:hover {
      border-color: var(--border2);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .apt-card.selected {
      border-color: var(--accent);
      background: rgba(99, 102, 241, .1);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .apt-card-num {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }

    .apt-card.is-manager .apt-card-num {
      color: var(--purple);
    }

    .apt-card-floor {
      font-size: 10px;
      color: var(--text3);
      text-align: center;
      line-height: 1.3;
    }

    .apt-card-status {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      gap: 3px;
      border: 1px solid transparent;
    }

    .apt-card-status.odenmedi {
      background: rgba(239, 68, 68, .15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, .3);
    }

    .apt-card-status.nakit {
      background: rgba(16, 185, 129, .15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, .3);
    }

    .apt-card-status.iban {
      background: rgba(16, 185, 129, .15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, .3);
    }

    .apt-card-status.yonetici {
      background: rgba(168, 85, 247, .15);
      color: #d8b4fe;
      border-color: rgba(168, 85, 247, .3);
    }

    .apt-card-amt {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
    }

    /* manager star */
    .mgr-star {
      position: absolute;
      top: 6px;
      right: 7px;
      font-size: 10px;
      opacity: .8;
    }

    /* Status chip (for detail panel) */
    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      border: 1px solid transparent;
      gap: 4px;
      padding: 0 10px;
    }

    .status-chip.odenmedi {
      background: rgba(239, 68, 68, .15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, .3);
    }

    .status-chip.nakit {
      background: rgba(16, 185, 129, .15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, .3);
    }

    .status-chip.iban {
      background: rgba(59, 130, 246, .15);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, .3);
    }

    .status-chip.yonetici {
      background: rgba(168, 85, 247, .15);
      color: #d8b4fe;
      border-color: rgba(168, 85, 247, .3);
    }

    /* ── RIGHT PANEL ──────────────────────────────────────────── */
    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text3);
      gap: 8px;
      font-size: 12px;
    }

    .detail-empty .icon {
      font-size: 32px;
    }

    .detail-apt-header {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(99, 102, 241, .15), rgba(168, 85, 247, .1));
      border: 1px solid rgba(99, 102, 241, .25);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .detail-apt-num {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }

    .detail-apt-num.mgr {
      background: linear-gradient(135deg, #a855f7, #7c3aed);
    }

    .detail-apt-info .name {
      font-size: 14px;
      font-weight: 700;
    }

    .detail-apt-info .sub {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
    }

    .detail-apt-info .badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      padding: 2px 7px;
      border-radius: 10px;
      margin-top: 5px;
    }

    .badge-yonetici {
      background: rgba(168, 85, 247, .2);
      color: var(--purple);
      border: 1px solid rgba(168, 85, 247, .4);
    }

    /* Status selector */
    .status-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .status-btn {
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
    }

    .status-btn:hover {
      border-color: var(--border2);
    }

    .status-btn.active-odenmedi {
      background: rgba(239, 68, 68, .15);
      border-color: rgba(239, 68, 68, .4);
      color: #fca5a5;
    }

    .status-btn.active-nakit {
      background: rgba(16, 185, 129, .15);
      border-color: rgba(16, 185, 129, .4);
      color: #6ee7b7;
    }

    .status-btn.active-iban {
      background: rgba(59, 130, 246, .15);
      border-color: rgba(59, 130, 246, .4);
      color: #93c5fd;
    }

    .status-btn.active-yonetici {
      background: rgba(168, 85, 247, .15);
      border-color: rgba(168, 85, 247, .4);
      color: #d8b4fe;
    }

    /* Info rows */
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row .lbl {
      color: var(--text3);
    }

    .info-row .val {
      font-weight: 600;
      color: var(--text);
    }

    /* History list */
    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      animation: fadeIn .3s ease;
    }

    .history-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .history-info {
      flex: 1;
    }

    .history-month {
      font-size: 11px;
      font-weight: 600;
    }

    .history-status {
      font-size: 10px;
      color: var(--text3);
    }

    .history-amt {
      font-size: 11px;
      font-weight: 700;
      color: var(--text2);
    }

    /* Grid scroll */
    .grid-scroll {
      max-height: calc(100vh - 240px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--surface3) transparent;
    }

    .grid-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .grid-scroll::-webkit-scrollbar-thumb {
      background: var(--surface3);
      border-radius: 4px;
    }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text3);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    /* Section header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    /* Progress mini */
    .progress-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .progress-mini .bar-wrap {
      flex: 1;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-mini .bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width .5s ease;
    }

    .progress-mini .pct {
      font-size: 12px;
      font-weight: 700;
      color: var(--text2);
      min-width: 32px;
      text-align: right;
    }

    /* Tooltip */
    [data-tip] {
      position: relative;
    }

    [data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 10px;
      white-space: nowrap;
      z-index: 100;
      pointer-events: none;
      box-shadow: var(--shadow);
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .layout {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }

      .panel,
      .middle-panel {
        height: auto;
        overflow: visible;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .matrix-scroll {
        max-height: none;
      }

      html,
      body {
        overflow: auto;
      }

      .apt-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 0 12px;
        gap: 6px;
      }
      header div[style*="font-size:11px"] {
        display: none !important;
      }
      .logo {
        font-size: 18px;
      }
      .header-kasa {
        margin-left: 4px;
        padding: 4px 8px;
        font-size: 11px;
        gap: 2px;
      }
      .header-kasa .lbl {
        display: none;
      }
      .header-kasa::before {
        content: "Bakiye:";
        color: var(--text3);
        font-weight: 500;
        font-size: 10px;
      }
      .month-nav {
        padding: 3px 8px;
        gap: 2px;
      }
      .month-nav button {
        font-size: 14px;
      }
      #monthLabel {
        min-width: 95px;
        font-size: 13px;
      }
      .year-badge {
        display: none;
      }
      .apt-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
    }

    @media (max-width: 400px) {
      .apt-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .status-btn {
        font-size: 10px;
        padding: 8px 4px;
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Gizem<span>Apt</span></div>
    <div style="font-size:11px;color:var(--text3);margin-right:15px;">Yönetim Paneli</div>
    <div class="header-kasa">
      <span class="lbl">Toplam Bakiye:</span>
      <span class="amt" id="headerKasaAmt">₺0</span>
    </div>
    <div class="sep"></div>
    <div class="month-nav">
      <button id="btnPrev">&#8249;</button>
      <div id="monthLabel"></div>
      <button id="btnNext">&#8250;</button>
    </div>
    <div class="year-badge" id="yearBadge"></div>
  </header>

  <div class="layout">

    <!-- LEFT: GELIR/GIDER -->
    <div class="panel" id="leftPanel">
      <div class="card">
        <div class="card-title">
          <div class="dot" style="background:var(--green)"></div>Bütçe Özeti
        </div>
        <div class="budget-grid">
          <div class="budget-item income">
            <div class="label">Toplam Gelir</div>
            <div class="value" id="totalIncome">₺0</div>
          </div>
          <div class="budget-item expense">
            <div class="label">Toplam Gider</div>
            <div class="value" id="totalExpense">₺0</div>
          </div>
          <div class="budget-item collected">
            <div class="label">Tahsil Aidat</div>
            <div class="value" id="totalCollected">₺0</div>
          </div>
          <div class="budget-item net" id="netCard">
            <div class="label">Net Bakiye</div>
            <div class="value" id="totalNet">₺0</div>
          </div>
        </div>
        <div class="progress-mini">
          <span style="font-size:10px;color:var(--text3);">Aidat Tahsilat</span>
          <div class="bar-wrap">
            <div class="bar-fill" id="collectionBar"
              style="background:linear-gradient(90deg,var(--purple),var(--accent2));width:0%"></div>
          </div>
          <div class="pct" id="collectionPct">0%</div>
        </div>
        <div class="budget-bar">
          <div class="budget-bar-fill" id="budgetBar" style="width:0%"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <div class="dot" style="background:var(--amber)"></div>Gider Grubu Filtresi
        </div>
        <div class="filter-pills" id="filterPills"></div>
      </div>

      <div class="card">
        <div class="section-header">
          <div class="card-title" style="margin-bottom:0">
            <div class="dot" style="background:var(--accent)"></div>İşlemler
          </div>
          <div id="txCount" style="font-size:10px;color:var(--text3)"></div>
        </div>
        <div class="tx-list" id="txList"></div>
      </div>
    </div>

    <!-- MIDDLE: GRID MATRIX -->
    <div class="middle-panel">
      <div class="stats-row" id="statsRow"></div>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
        <div class="dues-badge">
          <span class="lbl">Aylık Aidat:</span>
          <span class="amt" id="duesBadgeAmt">₺0</span>
        </div>
        <div style="flex:1"></div>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(239,68,68,.7)"></div>Ödenmedi
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(16,185,129,.7)"></div>Nakit -IBAN
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(168,85,247,.7)"></div>Yönetici
          </div>
        </div>
      </div>

      <div class="grid-scroll">
        <div class="apt-grid" id="aptGrid"></div>
      </div>
    </div>

    <!-- RIGHT: DETAIL -->
    <div class="panel" id="rightPanel">
      <div class="card-title" style="margin-bottom:12px">
        <div class="dot" style="background:var(--cyan)"></div>Daire Detayı
      </div>
      <div id="detailContent">
        <div class="detail-empty">
          <div class="icon">🏢</div>
          <div>Detay görmek için<br>tabloda bir daire seçin</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

    const CATEGORIES = [
      { key: 'tumu', label: 'Tümü', icon: '📋', color: '#94a3b8' },
      { key: 'gorevli', label: 'Görevli', icon: '👷', color: '#f59e0b' },
      { key: 'temizlik', label: 'Temizlik', icon: '🧹', color: '#06b6d4' },
      { key: 'fatura', label: 'Fatura', icon: '⚡', color: '#6366f1' },
      { key: 'bakim', label: 'Bakım', icon: '🔧', color: '#f97316' },
      { key: 'sigorta', label: 'Sigorta', icon: '🛡️', color: '#8b5cf6' },
      { key: 'diger', label: 'Diğer', icon: '📦', color: '#64748b' },
    ];

    const STATUSES = {
      odenmedi: { label: 'Ödenmedi', icon: '✕', cls: 'odenmedi' },
      nakit: { label: 'Nakit', icon: '💵', cls: 'nakit' },
      iban: { label: 'IBAN', icon: '🏦', cls: 'iban' },
      yonetici: { label: 'Yönetici', icon: '⭐', cls: 'yonetici' },
    };

    // data.json'dan yüklenecek
    let APARTMENTS = [];
    let DATA = {};

    // STATE
    let currentYear = 2026;
    let currentMonth = 8;
    let activeFilter = 'tumu';
    let selectedApt = null;

    function fmt(n) { return '₺' + n.toLocaleString('tr-TR'); }

    function getMonthData() {
      return DATA[`${currentYear}-${currentMonth}`] || { duesAmount: 850, transactions: [], payments: [] };
    }

    function getPayment(payments, aptId) {
      return payments.find(p => p.aptId === aptId) || { aptId, status: 'odenmedi' };
    }

    function animateCount(el, target) {
      const duration = 500;
      const startTime = performance.now();
      const step = (now) => {
        const p = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = '₺' + Math.round(eased * target).toLocaleString('tr-TR');
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function getMonthNet(mdata) {
      if (!mdata) return 0;
      const transactions = mdata.transactions || [];
      const payments = mdata.payments || [];
      const duesAmount = mdata.duesAmount || 0;

      let incomeSum = 0, expenseSum = 0;
      transactions.forEach(t => {
        if (t.type === 'income') incomeSum += t.amount;
        if (t.type === 'expense') expenseSum += t.amount;
      });

      const nonManagerApts = APARTMENTS.filter(a => !a.isManager);
      const paid = nonManagerApts.filter(a => {
        const p = payments.find(pay => pay.aptId === a.id) || { aptId: a.id, status: 'odenmedi' };
        return p.status !== 'odenmedi';
      }).length;

      const collectedDues = paid * duesAmount;
      const totalInc = incomeSum + collectedDues;
      return totalInc - expenseSum;
    }

    function getGlobalNet() {
      let total = 0;
      Object.values(DATA).forEach(mdata => {
        total += getMonthNet(mdata);
      });
      return total;
    }

    function renderHeader() {
      document.getElementById('monthLabel').textContent = MONTHS[currentMonth - 1] + ' ' + currentYear;
      document.getElementById('yearBadge').textContent = currentYear;

      const globalNet = getGlobalNet();
      const kasaEl = document.getElementById('headerKasaAmt');
      if (kasaEl) {
        kasaEl.textContent = (globalNet < 0 ? '-' : '') + '₺' + Math.abs(globalNet).toLocaleString('tr-TR');
        if (globalNet >= 0) {
          kasaEl.style.color = 'var(--green)';
        } else {
          kasaEl.style.color = 'var(--red)';
        }
      }
    }

    function renderLeft() {
      const md = getMonthData();
      const { transactions, payments, duesAmount } = md;

      let incomeSum = 0, expenseSum = 0;
      transactions.forEach(t => {
        if (t.type === 'income') incomeSum += t.amount;
        if (t.type === 'expense') expenseSum += t.amount;
      });

      const nonManagerApts = APARTMENTS.filter(a => !a.isManager);
      const paid = nonManagerApts.filter(a => {
        const p = getPayment(payments, a.id);
        return p.status !== 'odenmedi';
      }).length;
      const collectedDues = paid * duesAmount;
      const totalInc = incomeSum + collectedDues;
      const net = totalInc - expenseSum;
      const collectionPct = nonManagerApts.length > 0 ? Math.round((paid / nonManagerApts.length) * 100) : 0;

      animateCount(document.getElementById('totalIncome'), totalInc);
      animateCount(document.getElementById('totalExpense'), expenseSum);
      animateCount(document.getElementById('totalCollected'), collectedDues);

      const netEl = document.getElementById('totalNet');
      setTimeout(() => {
        netEl.textContent = (net < 0 ? '-' : '') + '₺' + Math.abs(net).toLocaleString('tr-TR');
      }, 500);

      const netCard = document.getElementById('netCard');
      netCard.className = 'budget-item net ' + (net >= 0 ? 'positive' : 'negative');

      document.getElementById('collectionBar').style.width = collectionPct + '%';
      document.getElementById('collectionPct').textContent = collectionPct + '%';
      const budgetPct = expenseSum > 0 ? Math.min(100, Math.round(totalInc / expenseSum * 100)) : 100;
      document.getElementById('budgetBar').style.width = budgetPct + '%';

      // Filter pills
      const pillsEl = document.getElementById('filterPills');
      pillsEl.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const p = document.createElement('div');
        p.className = 'pill' + (activeFilter === cat.key ? ' active' : '');
        p.textContent = cat.icon + ' ' + cat.label;
        p.onclick = () => { activeFilter = cat.key; renderLeft(); };
        pillsEl.appendChild(p);
      });

      // Transactions
      let txs = transactions;
      if (activeFilter !== 'tumu') txs = txs.filter(t => t.category === activeFilter);
      document.getElementById('txCount').textContent = txs.length + ' işlem';

      const listEl = document.getElementById('txList');
      listEl.innerHTML = '';

      if (txs.length === 0) {
        listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px;">Bu kategoride işlem yok</div>';
        return;
      }

      txs.forEach(t => {
        const cat = CATEGORIES.find(c => c.key === t.category) || CATEGORIES[0];
        const isInc = t.type === 'income';
        const item = document.createElement('div');
        item.className = 'tx-item';
        item.innerHTML = `
      <div class="tx-icon" style="background:${cat.color}22;">${cat.icon}</div>
      <div class="tx-info">
        <div class="tx-name">${t.name}</div>
        <div class="tx-cat">${cat.label}</div>
      </div>
      <div class="tx-amount ${isInc ? 'income' : 'expense'}">${isInc ? '+' : '-'}${fmt(t.amount)}</div>
      <div class="tx-date">${t.date}</div>
    `;
        listEl.appendChild(item);
      });
    }

    function renderMiddle() {
      const md = getMonthData();
      const { payments, duesAmount } = md;
      document.getElementById('duesBadgeAmt').textContent = fmt(duesAmount);

      const counts = { odenmedi: 0, nakit: 0, iban: 0, yonetici: 0 };
      APARTMENTS.forEach(apt => {
        const status = apt.isManager ? 'yonetici' : getPayment(payments, apt.id).status;
        if (counts[status] !== undefined) counts[status]++;
      });

      const statsEl = document.getElementById('statsRow');
      statsEl.innerHTML = '';
      [
        { key: 'odenmedi', label: 'Ödenmedi', color: 'var(--red)' },
        { key: 'nakit', label: 'Nakit', color: 'var(--green)' },
        { key: 'iban', label: 'IBAN', color: 'var(--blue)' },
        { key: 'yonetici', label: 'Yönetici', color: 'var(--purple)' },
      ].forEach(s => {
        const el = document.createElement('div');
        el.className = 'stat-card';
        el.innerHTML = `<div class="stat-num" style="color:${s.color}">${counts[s.key]}</div><div class="stat-lbl">${s.label}</div>`;
        statsEl.appendChild(el);
      });

      const grid = document.getElementById('aptGrid');
      grid.innerHTML = '';

      APARTMENTS.forEach(apt => {
        const pay = getPayment(payments, apt.id);
        const statusKey = apt.isManager ? 'yonetici' : pay.status;
        const st = STATUSES[statusKey];
        const isSelected = selectedApt && selectedApt.id === apt.id;

        const card = document.createElement('div');
        card.className = 'apt-card' + (apt.isManager ? ' is-manager' : '') + (isSelected ? ' selected' : '');
        card.onclick = () => { 
          selectedApt = apt; 
          renderMiddle(); 
          renderRight(); 
          if (window.innerWidth <= 900) {
            document.getElementById('rightPanel').scrollIntoView({ behavior: 'smooth' });
          }
        };

        card.innerHTML = `
          ${apt.isManager ? '<span class="mgr-star">⭐</span>' : ''}
          <div class="apt-card-num">${apt.id}</div>
          <div class="apt-card-status ${st.cls}">${st.icon} ${st.label}</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderRight() {
      const contentEl = document.getElementById('detailContent');
      if (!selectedApt) {
        contentEl.innerHTML = `<div class="detail-empty"><div class="icon">🏢</div><div>Detay görmek için<br>tabloda bir daire seçin</div></div>`;
        return;
      }

      const apt = selectedApt;
      const md = getMonthData();
      const { payments, duesAmount } = md;
      const pay = getPayment(payments, apt.id);
      const statusKey = apt.isManager ? 'yonetici' : pay.status;
      const st = STATUSES[statusKey];

      const history = Object.entries(DATA).map(([key, mdata]) => {
        const [y, m] = key.split('-').map(Number);
        const p = getPayment(mdata.payments, apt.id);
        const status = apt.isManager ? 'yonetici' : p.status;
        return { year: y, month: m, status: status, amount: mdata.duesAmount };
      }).sort((a, b) => b.year * 100 + b.month - (a.year * 100 + a.month));

      const statusBtns = apt.isManager
        ? `<div style="color:var(--text3);font-size:13px;padding:8px 0;font-style:italic;">Yönetici aidat ödemelerinden muaftır.</div>`
        : Object.entries(STATUSES).map(([key, s]) => `
    <div class="status-btn ${pay.status === key ? 'active-' + key : ''}" onclick="changeStatus(${apt.id},'${key}')">
      <span>${s.icon}</span> ${s.label}
    </div>
  `).join('');

      const dotColors = { odenmedi: '#ef4444', nakit: '#10b981', iban: '#3b82f6', yonetici: '#a855f7' };

      const histItems = history.map(h => {
        const hs = STATUSES[h.status];
        const isCurrent = h.year === currentYear && h.month === currentMonth;
        return `
      <div class="history-item" style="${isCurrent ? 'border-color:var(--accent);background:rgba(99,102,241,.07)' : ''}">
        <div class="history-dot" style="background:${dotColors[h.status]}"></div>
        <div class="history-info">
          <div class="history-month">${MONTHS[h.month - 1]} ${h.year}${isCurrent ? ' <span style="font-size:9px;color:var(--accent2)">(Bu ay)</span>' : ''}</div>
          <div class="history-status">${hs.label}</div>
        </div>
        <div class="history-amt">${h.status === 'yonetici' ? 'Muaf' : (h.status !== 'odenmedi' ? fmt(h.amount) : '–')}</div>
      </div>
    `;
      }).join('');

      const paidMonths = apt.isManager ? 0 : history.filter(h => h.status !== 'odenmedi').length;
      const totalPaid = apt.isManager ? 0 : history.filter(h => h.status !== 'odenmedi').reduce((s, h) => s + h.amount, 0);
      const unpaidMonths = apt.isManager ? 0 : history.filter(h => h.status === 'odenmedi').length;
      const payRatePct = apt.isManager ? 100 : Math.round(paidMonths / history.length * 100);

      contentEl.innerHTML = `
    <div class="detail-apt-header">
      <div class="detail-apt-num${apt.isManager ? ' mgr' : ''}">${apt.id}</div>
      <div class="detail-apt-info">
        <div class="name">Daire ${apt.id}</div>
        <div class="sub">${apt.floor || ''}</div>
        ${apt.isManager ? '<span class="badge badge-yonetici">⭐ Yönetici</span>' : ''}
      </div>
    </div>

    <div class="card">
      <div class="card-title"><div class="dot" style="background:var(--accent)"></div>Bu Ayki Durum</div>
      <div class="status-selector">${statusBtns}</div>
      <div class="info-row">
        <span class="lbl">Aidat Tutarı</span>
        <span class="val">${apt.isManager ? 'Muaf' : fmt(duesAmount)}</span>
      </div>
      <div class="info-row">
        <span class="lbl">Ödeme Durumu</span>
        <span class="status-chip ${st.cls}" style="height:24px;width:auto;padding:0 10px;">${st.icon} ${st.label}</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><div class="dot" style="background:var(--cyan)"></div>Özet İstatistik</div>
      <div class="info-row">
        <span class="lbl">Ödenen Ay</span>
        <span class="val" style="color:var(--green)">${apt.isManager ? 'Muaf' : `${paidMonths} / ${history.length}`}</span>
      </div>
      <div class="info-row">
        <span class="lbl">Toplam Ödeme</span>
        <span class="val">${fmt(totalPaid)}</span>
      </div>
      <div class="info-row">
        <span class="lbl">Eksik Ay</span>
        <span class="val" style="color:${unpaidMonths > 0 ? 'var(--red)' : 'var(--green)'}">${unpaidMonths}</span>
      </div>
      <div class="progress-mini">
        <span style="font-size:10px;color:var(--text3);">Ödeme oranı</span>
        <div class="bar-wrap">
          <div class="bar-fill" style="background:linear-gradient(90deg,var(--green),var(--cyan));width:${payRatePct}%"></div>
        </div>
        <div class="pct">${payRatePct}%</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><div class="dot" style="background:var(--amber)"></div>Ödeme Geçmişi</div>
      ${histItems}
    </div>
  `;
    }

    function changeStatus(aptId, newStatus) {
      const apt = APARTMENTS.find(a => a.id === aptId);
      if (apt && apt.isManager) return;
      const key = `${currentYear}-${currentMonth}`;
      if (!DATA[key]) return;
      const existing = DATA[key].payments.find(p => p.aptId === aptId);
      if (existing) existing.status = newStatus;
      else DATA[key].payments.push({ aptId, status: newStatus });
      renderAll();
    }

    function renderAll() {
      renderHeader();
      renderLeft();
      renderMiddle();
      renderRight();
    }

    document.getElementById('btnPrev').onclick = () => {
      currentMonth--;
      if (currentMonth < 1) { currentMonth = 12; currentYear--; }
      selectedApt = null;
      renderAll();
    };
    document.getElementById('btnNext').onclick = () => {
      currentMonth++;
      if (currentMonth > 12) { currentMonth = 1; currentYear++; }
      selectedApt = null;
      renderAll();
    };

    // data.json dosyasından veriyi yükle ve başlat
    fetch('data.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Veri yüklenemedi (HTTP ' + response.status + ')');
        }
        return response.json();
      })
      .then(jsonData => {
        APARTMENTS = jsonData.apartments;
        DATA = jsonData.months;
        renderAll();
      })
      .catch(error => {
        console.error('Veri yükleme hatası:', error);
        // CORS veya dosya bulunmama durumunda kullanıcı dostu hata ekranı
        const errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.height = '100%';
        errorDiv.style.background = 'rgba(11, 15, 26, 0.95)';
        errorDiv.style.color = '#ef4444';
        errorDiv.style.display = 'flex';
        errorDiv.style.flexDirection = 'column';
        errorDiv.style.alignItems = 'center';
        errorDiv.style.justifyContent = 'center';
        errorDiv.style.zIndex = '9999';
        errorDiv.style.fontFamily = 'sans-serif';
        errorDiv.style.padding = '20px';
        errorDiv.style.textAlign = 'center';

        errorDiv.innerHTML = `
          <h2 style="margin-bottom: 15px; font-size: 24px;">Veri Dosyası (data.json) Yüklenemedi!</h2>
          <p style="color: #94a3b8; max-width: 600px; line-height: 1.6; margin-bottom: 20px; font-size: 16px;">
            Tarayıcınız güvenlik nedenleriyle (CORS) yerel JSON dosyasını doğrudan okumanızı engelliyor olabilir. 
            Bu projeyi yerel bir web sunucusu (Live Server vb.) üzerinden çalıştırmayı deneyin veya data.json dosyasının doğru konumda olduğundan emin olun.
          </p>
          <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); padding: 12px 20px; border-radius: 8px; font-family: monospace; font-size: 14px;">
            Hata Detayı: ${error.message}
          </div>
        `;
        document.body.appendChild(errorDiv);
      });
  </script>
</body>

</html>
